name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      os_patch_level:
        description: "安全补丁级别 (如 2024-05、lts；填 lts 或留空=最新 LTS，无对应数据的月份会自动就近匹配)"
        required: true
        type: string
        default: "lts"

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
        default: ReSukiSU

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 选项配置 ====================
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          raw_input = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          entries = [e for e in (data.get("entries") or []) if e.get("date")]
          available = sorted(e["date"] for e in entries)


          def month_index(date_str):
              """把 YYYY-MM 换算成可比较的月份序号"""
              year, month = date_str.split("-")
              return int(year) * 12 + int(month)


          def resolve_by_date(normalized):
              """先精确匹配；没有对应数据时取月份距离最近的可用日期"""
              exact = next((e for e in entries if e["date"] == normalized), None)
              if exact is not None:
                  return exact, None
              if not available:
                  return None, None
              target = month_index(normalized)
              # 距离相同时取较新的日期：安全补丁级别偏新比偏旧更安全
              nearest = min(available, key=lambda d: (abs(month_index(d) - target), -month_index(d)))
              return next((e for e in entries if e["date"] == nearest), None), nearest


          if raw_input.lower() in ("", "lts"):
              kernel_full = data.get("lts")
              if not kernel_full:
                  print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                  sys.exit(1)
              resolved_patch_level = "lts"
              sub_level = "X"
          else:
              # 归一化输入：接受 2026-1、2026-01、2026-01-05、2026/01 等写法
              matched_input = re.match(r"^(\d{4})[-/.](\d{1,2})", raw_input)
              if matched_input is None:
                  print(f"::error::无法解析安全补丁级别 '{raw_input}'，请使用 YYYY-MM（如 2026-03）或 lts。")
                  print(f"::error::{android_version} / {kernel_version} 可用日期: {', '.join(available)}")
                  sys.exit(1)

              normalized = f"{matched_input.group(1)}-{int(matched_input.group(2)):02d}"
              matched, nearest = resolve_by_date(normalized)

              if matched is None:
                  print(f"::error::未找到 {android_version} / {kernel_version} 的版本数据")
                  print(f"::error::可用日期: {', '.join(available)}")
                  sys.exit(1)

              if nearest is not None:
                  print(
                      f"::warning title=安全补丁级别已就近调整::"
                      f"{normalized} 在 {android_version} / {kernel_version} 中没有对应数据，"
                      f"已改用最接近的 {nearest}"
                  )

              resolved_patch_level = matched["date"]
              kernel_full = matched.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                  sys.exit(1)
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")
              output.write(f"os_patch_level={resolved_patch_level}\n")

          print(
              f"解析结果: {android_version} / {kernel_full}，"
              f"子版本号: {sub_level}，安全补丁级别: {resolved_patch_level}"
          )
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ needs.resolve-version.outputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
